<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Account — Ultimate Final</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{font-family:Inter,sans-serif}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#EDE9E3;border-radius:10px}</style>
</head>
<body class="bg-[#FFFCF5] text-[#111] min-h-screen">
<div id="root"></div>
<script type="text/babel">
const KEY='villa-ultimate-v3';const DIR_KEY='villa-dir-handle';
const fmtINR=n=>{if(n==null||isNaN(n))return '₹0';return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);};
const fmtDate=d=>{if(!d)return'';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
const uid=()=> 'TXN-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Date.now().toString().slice(-4);
const isIframe=()=>{try{return window.top!==window.self}catch{return true}};
const CATS=["Construction","Material","Labour","Tiles","Electrical","Plumbing","Paint","Furniture","Appliances","Steel","Cement","Other"];

function App(){
const [people,setPeople]=React.useState([]);const [budget,setBudget]=React.useState(2000000);const [catBudgets,setCatBudgets]=React.useState({});const [cats,setCats]=React.useState(CATS);const [txs,setTxs]=React.useState([]);const [github,setGithub]=React.useState({username:'',repo:'villa-account',branch:'main',path:'data/villa-data.json',token:'',autoSync:false});const [page,setPage]=React.useState('home');const [showAdd,setShowAdd]=React.useState(false);const [addTab,setAddTab]=React.useState('IN');const [form,setForm]=React.useState({date:new Date().toISOString().slice(0,10),amount:'',personId:'',paidById:'',expenseName:'',category:'Construction',gst:false,gstRate:18,docRef:'',notes:'',isHistorical:false,vendor:'',paymentMode:'UPI'});const [search,setSearch]=React.useState('');const [filterType,setFilterType]=React.useState('ALL');const [filterPerson,setFilterPerson]=React.useState('');const [filterCat,setFilterCat]=React.useState('');const [savedAt,setSavedAt]=React.useState(null);const [saveStatus,setSaveStatus]=React.useState('saved');const [dirName,setDirName]=React.useState('');const [dirConnected,setDirConnected]=React.useState(false);const [githubStatus,setGithubStatus]=React.useState('');const [onboardingStep,setOnboardingStep]=React.useState(0);const [villaArea,setVillaArea]=React.useState(2500);const [showSettings,setShowSettings]=React.useState(false);const [toast,setToast]=React.useState('');const saveTimeout=React.useRef(null);const dirHandleRef=React.useRef(null);

React.useEffect(()=>{
try{
const raw=localStorage.getItem(KEY);
if(raw){const d=JSON.parse(raw);if(d.people)setPeople(d.people);if(d.budget)setBudget(d.budget);if(d.catBudgets)setCatBudgets(d.catBudgets);if(d.cats)setCats(d.cats);if(d.txs)setTxs(d.txs);if(d.villaArea)setVillaArea(d.villaArea);if(d.savedAt)setSavedAt(new Date(d.savedAt));if(d.people&&d.people.length>0)setOnboardingStep(3);}
const g=localStorage.getItem('villa-github');if(g)setGithub(JSON.parse(g));
}catch{}
(async()=>{
try{
const db=await new Promise((res,rej)=>{const r=indexedDB.open('villa-idb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=db.transaction('s','readonly');const st=tx.objectStore('s');const req=st.get(DIR_KEY);
req.onsuccess=async()=>{
const h=req.result;
if(h){dirHandleRef.current=h;setDirName(h.name||'Folder');setDirConnected(true);
try{
const perm=await h.queryPermission({mode:'readwrite'});
if(perm!=='granted'){const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return;}
const fh=await h.getFileHandle('villa-data.json');const f=await fh.getFile();const txt=await f.text();const data=JSON.parse(txt);
if(data.people)setPeople(data.people);if(data.budget)setBudget(data.budget);if(data.txs)setTxs(data.txs);if(data.cats)setCats(data.cats);if(data.catBudgets)setCatBudgets(data.catBudgets);
setToast('Loaded from Desktop Folder ✓');setTimeout(()=>setToast(''),2000);
}catch(e){}
}
};
}catch{}
})();
},[]);

function getFull(){return {version:12,budget,catBudgets,cats,people,txs,villaArea,savedAt:new Date().toISOString()};}
function getSanitized(){const d=getFull();return {version:d.version,budget:d.budget,catBudgets:d.catBudgets,cats:d.cats,people:d.people,txs:d.txs,villaArea:d.villaArea,savedAt:d.savedAt};}
async function saveToDir(data){
if(!dirHandleRef.current)return;
try{
const perm=await dirHandleRef.current.requestPermission({mode:'readwrite'});if(perm!=='granted')return;
const fh=await dirHandleRef.current.getFileHandle('villa-data.json',{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();setSaveStatus('saved');setSavedAt(new Date());
}catch(e){}
}
async function saveToGithub(sanitized,isAuto=false){
if(!github.username||!github.repo||!github.token)return;
try{
if(!isAuto)setGithubStatus('Saving...');
const content=btoa(unescape(encodeURIComponent(JSON.stringify(sanitized,null,2))));
let sha=null;
try{const r=await fetch(`https://api.github.com/repos/${github.username}/${github.repo}/contents/${github.path}?ref=${github.branch}`,{headers:{Authorization:`token ${github.token}`}});if(r.ok){const j=await r.json();sha=j.sha;}}catch{}
const body={message:`Update villa data ${new Date().toISOString()}`,content,branch:github.branch,...(sha?{sha}:{})};
const pr=await fetch(`https://api.github.com/repos/${github.username}/${github.repo}/contents/${github.path}`,{method:'PUT',headers:{Authorization:`token ${github.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
if(!pr.ok){const t=await pr.text();throw Error(t.slice(0,300));}
if(!isAuto){setGithubStatus('GitHub ✓ '+new Date().toLocaleTimeString());setToast('Saved to GitHub ✓');setTimeout(()=>setToast(''),2000);}else setGithubStatus('Auto-synced '+new Date().toLocaleTimeString());
}catch(e){
const msg=e.message||'';if(msg.includes('Secret detected')||msg.includes('409')){setGithubStatus('Fixed 409: token removed. Save again.');setToast('Fixed 409 — token removed');}else{setGithubStatus('✗ '+msg.slice(0,120));}
}
}

React.useEffect(()=>{
if(people.length===0&&txs.length===0)return;
setSaveStatus('saving');
if(saveTimeout.current)clearTimeout(saveTimeout.current);
saveTimeout.current=setTimeout(async()=>{
const full=getFull();const sanitized=getSanitized();
try{localStorage.setItem(KEY,JSON.stringify(full));}catch{}
try{const db=await new Promise((res,rej)=>{const r=indexedDB.open('villa-idb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const tx=db.transaction('s','readwrite');tx.objectStore('s').put(full,KEY);}catch{}
await saveToDir(full);setSavedAt(new Date());setSaveStatus('saved');
if(github.autoSync)await saveToGithub(sanitized,true);
},600);
},[people,budget,catBudgets,cats,txs,villaArea]);

React.useEffect(()=>{localStorage.setItem('villa-github',JSON.stringify(github));},[github]);

const accountStarts=React.useMemo(()=>{
const m={};people.forEach(p=>{const ins=txs.filter(t=>t.type==='IN'&&t.personId===p.id&&t.date).sort((a,b)=>a.date.localeCompare(b.date));if(ins.length)m[p.id]=ins[0].date;});return m;
},[txs,people]);

const calc=React.useMemo(()=>{
const totalIn=txs.filter(t=>t.type==='IN'&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const villaCurrent=txs.filter(t=>t.type==='VILLA'&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const villaHist=txs.filter(t=>t.type==='VILLA'&&t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const villaAll=villaCurrent+villaHist;
const personalCurrent=txs.filter(t=>t.type==='PERSONAL'&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const personalHist=txs.filter(t=>t.type==='PERSONAL'&&t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const advanceCurrent=txs.filter(t=>t.type==='ADVANCE'&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const perPerson=people.map(p=>{
const insCurrent=txs.filter(t=>t.type==='IN'&&t.personId===p.id&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const villaPaidC=txs.filter(t=>t.type==='VILLA'&&t.paidById===p.id&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const villaPaidH=txs.filter(t=>t.type==='VILLA'&&t.paidById===p.id&&t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const personalC=txs.filter(t=>t.type==='PERSONAL'&&t.personId===p.id&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const personalH=txs.filter(t=>t.type==='PERSONAL'&&t.personId===p.id&&t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const advC=txs.filter(t=>t.type==='ADVANCE'&&t.paidById===p.id&&!t.isHistorical).reduce((s,t)=>s+Number(t.amount||0),0);
const totalOutCurrent=villaPaidC+personalC+advC;
const balance=insCurrent-totalOutCurrent;
return {person:p,start:accountStarts[p.id],insCurrent,villaPaidC,villaPaidH,personalC,personalH,advC,totalOutCurrent,balance};
});
const activePeople=people.filter(p=>p.active!==false);
const equalShare=activePeople.length? villaCurrent/activePeople.length :0;
const settlement=perPerson.map(pp=>({...pp,diff:pp.villaPaidC-equalShare,equalShare}));
const creditors=settlement.filter(s=>s.diff>0.01).sort((a,b)=>b.diff-a.diff).map(s=>({...s}));
const debtors=settlement.filter(s=>s.diff<-0.01).sort((a,b)=>a.diff-b.diff).map(s=>({...s,diff:-s.diff}));
const owes=[];let i=0,j=0;const cred=[...creditors],debt=[...debtors];
while(i<cred.length&&j<debt.length){const c=cred[i],d=debt[j];const amt=Math.min(c.diff,d.diff);owes.push({from:d.person,to:c.person,amount:amt});c.diff-=amt;d.diff-=amt;if(c.diff<0.01)i++;if(d.diff<0.01)j++;}
const vendorMap={};txs.filter(t=>t.type==='VILLA').forEach(t=>{const v=(t.vendor||t.expenseName||'Unknown').trim();if(!vendorMap[v])vendorMap[v]={name:v,total:0,count:0,gst:0,last:t.date};vendorMap[v].total+=Number(t.amount||0);vendorMap[v].count+=1;if(t.gst)vendorMap[v].gst+=Number(t.gstAmount||t.amount*0.18);if(!vendorMap[v].last||t.date>vendorMap[v].last)vendorMap[v].last=t.date;});
const vendors=Object.values(vendorMap).sort((a,b)=>b.total-a.total);
const monthly={};txs.forEach(t=>{if(!t.date)return;const m=t.date.slice(0,7);if(!monthly[m])monthly[m]={month:m,in:0,villa:0,personal:0,advance:0};if(t.type==='IN'&&!t.isHistorical)monthly[m].in+=Number(t.amount||0);if(t.type==='VILLA'&&!t.isHistorical)monthly[m].villa+=Number(t.amount||0);if(t.type==='PERSONAL'&&!t.isHistorical)monthly[m].personal+=Number(t.amount||0);if(t.type==='ADVANCE'&&!t.isHistorical)monthly[m].advance+=Number(t.amount||0);});
const monthlyArr=Object.values(monthly).sort((a,b)=>a.month.localeCompare(b.month));let running=0;monthlyArr.forEach(m=>{running+=m.in-m.villa-m.personal-m.advance;m.closing=running;});
const burnRate=monthlyArr.length? villaCurrent/monthlyArr.length :0;const leftBudget=budget-villaCurrent;
const catTotals={};cats.forEach(c=>catTotals[c]=0);txs.filter(t=>t.type==='VILLA'&&!t.isHistorical).forEach(t=>{const c=t.category||'Other';catTotals[c]=(catTotals[c]||0)+Number(t.amount||0);});
const catHist={};cats.forEach(c=>catHist[c]=0);txs.filter(t=>t.type==='VILLA'&&t.isHistorical).forEach(t=>{const c=t.category||'Other';catHist[c]=(catHist[c]||0)+Number(t.amount||0);});
const audits=[];txs.forEach(t=>{if(!t.date)audits.push({type:'Missing Date',msg:'Missing Date'});if(t.type==='VILLA'&&!t.paidById)audits.push({type:'Villa no Paid By',msg:`Villa "${t.expenseName}" missing Paid By`});if(t.gst&&!t.docRef)audits.push({type:'GST no Doc',msg:`GST Yes no Doc: ${t.expenseName}`});if(t.type==='VILLA'&&!t.category)audits.push({type:'No Category',msg:`Villa no Category`});if(t.date&&t.personId&&accountStarts[t.personId]&&t.date<accountStarts[t.personId]&&!t.isHistorical)audits.push({type:'Before start',msg:`Before start not flagged: ${t.expenseName||t.type}`});});
const seen={};txs.forEach(t=>{const k=`${t.date}-${t.amount}-${t.expenseName}`;if(seen[k])audits.push({type:'Duplicate',msg:`Duplicate with ${seen[k]}`});else seen[k]=t.id;});perPerson.forEach(pp=>{if(pp.balance<0)audits.push({type:'Negative',msg:`${pp.person.name} negative ${fmtINR(pp.balance)}`});});Object.entries(catTotals).forEach(([cat,spent])=>{const b=catBudgets[cat];if(b&&spent>b)audits.push({type:'Over budget',msg:`${cat} over budget`});});
return {totalIn,villaCurrent,villaHist,villaAll,personalCurrent,personalHist,advanceCurrent,perPerson,settlement,equalShare,owes,vendors,monthlyArr,burnRate,leftBudget,catTotals,catHist,audits};
},[txs,people,accountStarts,budget,catBudgets,cats]);

const filteredTxs=React.useMemo(()=>{
return txs.filter(t=>{
if(filterType!=='ALL'){if(filterType==='HISTORICAL'){if(!t.isHistorical)return false;}else if(t.type!==filterType)return false;}
if(filterPerson&&t.personId!==filterPerson&&t.paidById!==filterPerson)return false;
if(filterCat&&t.category!==filterCat)return false;
if(search){const s=search.toLowerCase();if(!((t.expenseName||'').toLowerCase().includes(s)||(t.notes||'').toLowerCase().includes(s)||(t.vendor||'').toLowerCase().includes(s)||(t.docRef||'').toLowerCase().includes(s)))return false;}
return true;
}).sort((a,b)=>b.date.localeCompare(a.date));
},[txs,filterType,filterPerson,filterCat,search]);

async function connectFolder(){
if(isIframe()){setToast('Open in New Tab to enable folder');return;}
try{
if(!window.showDirectoryPicker){setToast('Use Chrome/Edge');return;}
const h=await window.showDirectoryPicker({mode:'readwrite'});
dirHandleRef.current=h;setDirName(h.name);setDirConnected(true);
const db=await new Promise((res,rej)=>{const r=indexedDB.open('villa-idb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=db.transaction('s','readwrite');tx.objectStore('s').put(h,DIR_KEY);
await saveToDir(getFull());setToast('Desktop Folder connected ✓');setTimeout(()=>setToast(''),2000);
}catch(e){if(e.name!=='AbortError')setToast('Folder error: '+e.message);}
}
async function handleGithubTest(){if(!github.username||!github.repo||!github.token){setGithubStatus('Fill username, repo, token');return;}setGithubStatus('Testing...');try{const r=await fetch(`https://api.github.com/repos/${github.username}/${github.repo}`,{headers:{Authorization:`token ${github.token}`}});if(!r.ok)throw Error(`${r.status} ${await r.text()}`);setGithubStatus('Connected ✓');}catch(e){setGithubStatus('✗ '+e.message.slice(0,150));}}
async function handleGithubLoad(){if(!github.username||!github.repo||!github.token){setGithubStatus('Fill all');return;}setGithubStatus('Loading...');try{const r=await fetch(`https://api.github.com/repos/${github.username}/${github.repo}/contents/${github.path}?ref=${github.branch}`,{headers:{Authorization:`token ${github.token}`}});if(r.status===404)throw Error('File not found — Save first');if(!r.ok)throw Error(await r.text());const j=await r.json();const txt=decodeURIComponent(escape(atob(j.content)));const data=JSON.parse(txt);if(data.people)setPeople(data.people);if(data.budget)setBudget(data.budget);if(data.txs)setTxs(data.txs);if(data.cats)setCats(data.cats);if(data.catBudgets)setCatBudgets(data.catBudgets);setGithubStatus('Loaded ✓');setToast('Loaded from GitHub ✓');}catch(e){setGithubStatus('✗ '+e.message.slice(0,200));}}
async function handleGithubSave(){const sanitized=getSanitized();await saveToGithub(sanitized,false);}
function handleAdd(){
if(!form.amount||Number(form.amount)<=0){setToast('Enter amount');return;}
if(!form.date){setToast('Pick date');return;}
let personId=form.personId;let paidById=form.paidById;
if(addTab==='IN'&&!personId){setToast('Select person');return;}
if((addTab==='VILLA'||addTab==='ADVANCE')&&!paidById){setToast('Select Paid By');return;}
if(addTab==='PERSONAL'&&!personId){setToast('Select person');return;}
let isHist=form.isHistorical;const start=personId? accountStarts[personId] : (paidById? accountStarts[paidById] : null);if(!isHist&&start&&form.date<start)isHist=true;
const amt=Number(form.amount);const gstAmt=form.gst? Math.round(amt*form.gstRate/100):0;
const newTx={id:uid(),type:addTab==='IN'?'IN':addTab==='VILLA'?'VILLA':addTab==='PERSONAL'?'PERSONAL':'ADVANCE',date:form.date,amount:amt,personId:personId||null,paidById:paidById||null,expenseName:form.expenseName,category:form.category,gst:form.gst,gstRate:form.gstRate,gstAmount:gstAmt,docRef:form.docRef,notes:form.notes,isHistorical:isHist,vendor:form.vendor||form.expenseName,paymentMode:form.paymentMode,createdAt:new Date().toISOString()};
setTxs(t=>[newTx,...t]);setShowAdd(false);setForm(f=>({...f,amount:'',expenseName:'',docRef:'',notes:'',vendor:'',isHistorical:false}));setToast('Added ✓');setTimeout(()=>setToast(''),1500);
}

if(people.length===0&&onboardingStep<3){
return (
<div className="min-h-screen flex items-center justify-center p-6 bg-[#FFFCF5]">
<div className="max-w-md w-full bg-white rounded-[24px] border p-8 shadow-sm" style={{borderColor:'#EDE9E3'}}>
{onboardingStep===0&&<div><div className="text-[28px] font-bold leading-tight">Villa Account — Ultimate Final</div><div className="mt-3 text-[14px] opacity-70">Clean UI + Full accounting + Real save + Historical logic. Fixed blank page + fixed 409.</div><button onClick={()=>setOnboardingStep(1)} className="mt-6 w-full h-12 rounded-full bg-[#111] text-white font-semibold">Start →</button></div>}
{onboardingStep===1&&<div><div className="font-bold text-[18px]">Step 1: Add people</div>
<div className="mt-4 space-y-2">{people.map((p,i)=><div key={p.id} className="flex gap-2"><input value={p.name} onChange={ev=>setPeople(ps=>ps.map((x,idx)=>idx===i?{...x,name:ev.target.value}:x))} className="flex-1 h-11 rounded-xl border px-3" placeholder="Name" style={{borderColor:'#EDE9E3'}}/><button onClick={()=>setPeople(ps=>ps.filter((_,idx)=>idx!==i))} className="h-11 w-11 rounded-xl border">×</button></div>)}<button onClick={()=>{const colors=['#FF5A1F','#0EA5E9','#10B981','#8B5CF6'];setPeople(p=>[...p,{id:'P'+Date.now(),name:'',color:colors[p.length%colors.length],active:true}])}} className="w-full h-11 rounded-xl border border-dashed" style={{borderColor:'#EDE9E3'}}>+ Add person</button>
<div className="mt-6 flex gap-2"><button onClick={()=>setOnboardingStep(0)} className="flex-1 h-11 rounded-full border">Back</button><button onClick={()=>{const valid=people.filter(p=>p.name.trim());if(valid.length<2){setToast('Add at least 2');return;}setPeople(valid);setOnboardingStep(2);}} className="flex-1 h-11 rounded-full bg-[#111] text-white">Next</button></div></div></div>}
{onboardingStep===2&&<div><div className="font-bold text-[18px]">Step 2: Budget</div><div className="mt-4"><div className="text-[32px] font-bold">{fmtINR(budget)}</div><input type="range" min="100000" max="10000000" step="50000" value={budget} onChange={ev=>setBudget(Number(ev.target.value))} className="w-full mt-3"/></div><div className="mt-6 text-[12px] opacity-70 space-y-1"><div>• IN = capital</div><div>• Villa = shared</div><div>• Personal = individual</div><div>• Historical = before Money In, does NOT deduct (your Aug 2025 logic)</div><div>• Advance = contractor advance</div></div><div className="mt-6 flex gap-2"><button onClick={()=>setOnboardingStep(1)} className="flex-1 h-11 rounded-full border">Back</button><button onClick={()=>setOnboardingStep(3)} className="flex-1 h-11 rounded-full bg-[#FF5A1F] text-white">Finish →</button></div></div>}
</div>
</div>
);
}

return (
<div className="min-h-screen pb-24">
{isIframe()&&<div className="sticky top-0 z-50 bg-[#111] text-white text-[12px] px-4 py-2 flex items-center justify-between"><span>⚠ Preview mode — Desktop Folder blocked. Open in New Tab. GitHub works.</span><a href={window.location.href} target="_blank" rel="noopener" className="ml-3 h-7 px-3 rounded-full bg-white text-black text-[11px] font-semibold inline-flex items-center">Open in New Tab ↗</a></div>}
<div className="sticky top-0 z-40 bg-[#FFFCF5]/90 backdrop-blur border-b" style={{borderColor:'#EDE9E3'}}>
<div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
<div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-[#111] text-white flex items-center justify-center font-bold text-[13px]">V</div><div><div className="font-bold text-[14px] leading-none">Villa Ultimate — Fixed</div><div className="text-[10px] opacity-60 flex items-center gap-1.5 mt-0.5"><span className={`w-2 h-2 rounded-full ${saveStatus==='saving'?'bg-amber-400 animate-pulse':'bg-emerald-500'}`}></span>{saveStatus==='saving'?'Saving...':`Saved • ${savedAt? savedAt.toLocaleTimeString():''}`} {dirConnected? ` • Desktop: ${dirName}`:' • Browser'} {githubStatus? ` • ${githubStatus.slice(0,30)}`:''}</div></div></div>
<div className="flex items-center gap-2"><button onClick={()=>setShowSettings(v=>!v)} className="h-9 w-9 rounded-full border bg-white flex items-center justify-center" style={{borderColor:'#EDE9E3'}}>⚙️</button><button onClick={()=>setShowAdd(true)} className="h-9 px-4 rounded-full bg-[#FF5A1F] text-white text-[12px] font-semibold">+ Add</button></div>
</div>

</div></div>
<div className="rounded-[20px] bg-white border p-4" style={{borderColor:'#EDE9E3'}}><div className="font-bold text-[13px]">People & Budgets</div><div className="mt-3 space-y-2">{people.map(p=><div key={p.id} className="flex gap-2 items-center"><div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background:p.color}}>{p.name[0]}</div><input value={p.name} onChange={ev=>setPeople(ps=>ps.map(x=>x.id===p.id?{...x,name:ev.target.value}:x))} className="flex-1 h-9 rounded-xl border px-3 text-[12px]" style={{borderColor:'#EDE9E3'}}/><button onClick={()=>setPeople(ps=>ps.filter(x=>x.id!==p.id))} className="h-9 w-9 rounded-xl border">×</button></div>)}<button onClick={()=>{const colors=['#FF5A1F','#0EA5E9','#10B981','#8B5CF6'];setPeople(p=>[...p,{id:'P'+Date.now(),name:'',color:colors[p.length%4],active:true}])}} className="w-full h-9 rounded-xl border border-dashed text-[12px]" style={{borderColor:'#EDE9E3'}}>+ Add person</button><div className="mt-4"><div className="text-[12px] opacity-60">Total Budget</div><input type="number" value={budget} onChange={ev=>setBudget(Number(ev.target.value))} className="mt-1 w-full h-9 rounded-xl border px-3" style={{borderColor:'#EDE9E3'}}/></div><div className="mt-3"><div className="text-[12px] opacity-60">Area sq ft</div><input type="number" value={villaArea} onChange={ev=>setVillaArea(Number(ev.target.value))} className="mt-1 w-full h-9 rounded-xl border px-3" style={{borderColor:'#EDE9E3'}}/></div></div>
<div className="rounded-[20px] bg-white border p-4" style={{borderColor:'#EDE9E3'}}><div className="font-bold text-[13px]">Data</div><div className="mt-3 flex flex-wrap gap-2"><button onClick={()=>{const data=getSanitized();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`villa-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();}} className="h-9 px-3 rounded-full border bg-white text-[11px]" style={{borderColor:'#EDE9E3'}}>Export JSON</button><button onClick={()=>{let csv='Date,Type,Expense,Category,Amount,PaidBy,Person,Vendor,GST,DocRef,Historical,Notes\n';txs.forEach(t=>{csv+=`${t.date},${t.type},${(t.expenseName||'').replace(/,/g,' ')},${t.category||''},${t.amount},${people.find(p=>p.id===t.paidById)?.name||''},${people.find(p=>p.id===t.personId)?.name||''},${(t.vendor||'').replace(/,/g,' ')},${t.gst?'Yes':''},${t.docRef||''},${t.isHistorical?'Yes':''},${(t.notes||'').replace(/,/g,' ')}\n`;});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='villa-export.csv';a.click();}} className="h-9 px-3 rounded-full border bg-white text-[11px]" style={{borderColor:'#EDE9E3'}}>Export CSV</button><button onClick={()=>{if(prompt('Type DELETE to clear')==='DELETE'){setTxs([]);localStorage.removeItem(KEY);setToast('Cleared');}}} className="h-9 px-3 rounded-full border bg-red-50 text-red-600 text-[11px]" style={{borderColor:'#EDE9E3'}}>Clear All</button></div><div className="mt-3"><input type="file" accept=".json" onChange={async(ev)=>{const f=ev.target.files[0];if(!f)return;const txt=await f.text();const d=JSON.parse(txt);if(d.people)setPeople(d.people);if(d.txs)setTxs(d.txs);if(d.budget)setBudget(d.budget);setToast('Imported ✓');}} className="text-[11px]"/></div></div>
</div></div></div>}

<div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t" style={{borderColor:'#EDE9E3'}}><div className="max-w-6xl mx-auto px-2 h-16 flex items-center justify-around">{[['home','Home'],['transactions','Txns'],['villa','Villa'],['people','People'],['reports','Reports']].map(([k,label])=><button key={k} onClick={()=>setPage(k)} className={`flex flex-col items-center gap-1 px-3 py-1 rounded-full ${page===k?'bg-[#111] text-white':'opacity-60'}`}><span className="text-[16px]">{k==='home'?'⌂':k==='transactions'?'≡':k==='villa'?'⌖':k==='people'?'◐':'◫'}</span><span className="text-[10px] font-medium">{label}</span></button>)}</div></div>

{showAdd&&<div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"><div className="absolute inset-0 bg-black/20" onClick={()=>setShowAdd(false)}></div><div className="relative w-full max-w-lg bg-white rounded-t-[24px] md:rounded-[24px] border shadow-xl max-h-[90vh] overflow-auto" style={{borderColor:'#EDE9E3'}}><div className="sticky top-0 bg-white p-5 border-b flex justify-between items-center" style={{borderColor:'#EDE9E3'}}><div className="font-bold">Add Transaction</div><button onClick={()=>setShowAdd(false)} className="h-8 w-8 rounded-full border">×</button></div><div className="p-5"><div className="flex gap-2 mb-4">{[['IN','Money In'],['VILLA','Villa'],['PERSONAL','Personal'],['ADVANCE','Advance']].map(([k,l])=><button key={k} onClick={()=>setAddTab(k)} className={`flex-1 h-10 rounded-full border text-[12px] font-medium ${addTab===k?'bg-[#111] text-white border-[#111]':'bg-white'}`} style={{borderColor:addTab===k?'#111':'#EDE9E3'}}>{l}</button>)}</div><div className="space-y-3">
<div className="grid grid-cols-2 gap-2"><div><div className="text-[11px] opacity-60">Date</div><input type="date" value={form.date} onChange={ev=>setForm(f=>({...f,date:ev.target.value}))} className="w-full h-11 rounded-xl border px-3 text-[13px]" style={{borderColor:'#EDE9E3'}}/></div><div><div className="text-[11px] opacity-60">Amount ₹</div><input type="number" value={form.amount} onChange={ev=>setForm(f=>({...f,amount:ev.target.value}))} className="w-full h-11 rounded-xl border px-3 text-[13px] font-bold" style={{borderColor:'#EDE9E3'}} placeholder="0"/></div></div>
{addTab==='IN'&&<div><div className="text-[11px] opacity-60 mb-1">Person</div><div className="flex flex-wrap gap-2">{people.map(p=><button key={p.id} onClick={()=>setForm(f=>({...f,personId:p.id}))} className={`h-9 px-3 rounded-full border flex items-center gap-1.5 text-[12px] ${form.personId===p.id?'bg-[#111] text-white border-[#111]':'bg-white'}`} style={{borderColor:form.personId===p.id?'#111':'#EDE9E3'}}><span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background:p.color}}>{p.name[0]}</span>{p.name}</button>)}</div></div>}
{(addTab==='VILLA'||addTab==='ADVANCE')&&<div><div className="text-[11px] opacity-60 mb-1">Paid By</div><div className="flex flex-wrap gap-2">{people.map(p=><button key={p.id} onClick={()=>setForm(f=>({...f,paidById:p.id}))} className={`h-9 px-3 rounded-full border flex items-center gap-1.5 text-[12px] ${form.paidById===p.id?'bg-[#111] text-white border-[#111]':'bg-white'}`} style={{borderColor:form.paidById===p.id?'#111':'#EDE9E3'}}><span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background:p.color}}>{p.name[0]}</span>{p.name}</button>)}</div></div>}
{addTab==='PERSONAL'&&<div><div className="text-[11px] opacity-60 mb-1">Person</div><div className="flex flex-wrap gap-2">{people.map(p=><button key={p.id} onClick={()=>setForm(f=>({...f,personId:p.id}))} className={`h-9 px-3 rounded-full border flex items-center gap-1.5 text-[12px] ${form.personId===p.id?'bg-[#111] text-white border-[#111]':'bg-white'}`} style={{borderColor:form.personId===p.id?'#111':'#EDE9E3'}}><span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background:p.color}}>{p.name[0]}</span>{p.name}</button>)}</div></div>}
{(addTab==='VILLA'||addTab==='ADVANCE'||addTab==='PERSONAL')&&<div><div className="text-[11px] opacity-60 mb-1">{addTab==='PERSONAL'?'Description':'Expense Name / Vendor'}</div><input value={form.expenseName} onChange={ev=>setForm(f=>({...f,expenseName:ev.target.value,vendor:ev.target.value}))} placeholder={addTab==='PERSONAL'?'e.g., Cab, Food':'e.g., Vikas, Tiles'} className="w-full h-11 rounded-xl border px-3 text-[13px]" style={{borderColor:'#EDE9E3'}}/>{addTab==='VILLA'&&<div className="mt-2 flex gap-2"><select value={form.category} onChange={ev=>setForm(f=>({...f,category:ev.target.value}))} className="flex-1 h-10 rounded-xl border px-3 text-[12px] bg-white" style={{borderColor:'#EDE9E3'}}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select><select value={form.paymentMode} onChange={ev=>setForm(f=>({...f,paymentMode:ev.target.value}))} className="w-28 h-10 rounded-xl border px-3 text-[12px] bg-white" style={{borderColor:'#EDE9E3'}}>{['UPI','Cash','Bank'].map(m=><option key={m} value={m}>{m}</option>)}</select></div>}</div>}
<div className="grid grid-cols-2 gap-2"><div><div className="text-[11px] opacity-60 mb-1">Doc Ref</div><input value={form.docRef} onChange={ev=>setForm(f=>({...f,docRef:ev.target.value}))} className="w-full h-10 rounded-xl border px-3 text-[12px]" style={{borderColor:'#EDE9E3'}} placeholder="Bill #"/></div><div className="flex items-end gap-2"><label className="flex items-center gap-2 h-10 px-3 rounded-xl border text-[12px] bg-white" style={{borderColor:'#EDE9E3'}}><input type="checkbox" checked={form.gst} onChange={ev=>setForm(f=>({...f,gst:ev.target.checked}))}/>GST</label>{form.gst&&<select value={form.gstRate} onChange={ev=>setForm(f=>({...f,gstRate:Number(ev.target.value)})} className="h-10 rounded-xl border px-2 text-[12px] bg-white" style={{borderColor:'#EDE9E3'}}>{[5,12,18,28].map(r=><option key={r} value={r}>{r}%</option>)}</select>}</div></div>
<div><div className="text-[11px] opacity-60 mb-1">Notes</div><input value={form.notes} onChange={ev=>setForm(f=>({...f,notes:ev.target.value}))} className="w-full h-10 rounded-xl border px-3 text-[12px]" style={{borderColor:'#EDE9E3'}} placeholder="Optional"/></div>
<label className="flex items-start gap-2 p-3 rounded-xl border bg-amber-50 text-[11px]" style={{borderColor:'#EDE9E3'}}><input type="checkbox" checked={form.isHistorical} onChange={ev=>setForm(f=>({...f,isHistorical:ev.target.checked}))}/><span><b>Historical — don't deduct</b> — old entry before Money In (e.g., Aug 2025 when Money In Sep 2026). Auto-detected if date &lt; first IN.</span></label>
</div><button onClick={handleAdd} className="mt-6 w-full h-12 rounded-full bg-[#FF5A1F] text-white font-semibold">Add Transaction</button></div></div></div>}

{toast&&<div className="fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#111] text-white text-[12px] px-4 py-2 rounded-full shadow-lg z-50">{toast}</div>}
</div>
);
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
